name: studio-pages
# Builds the Meadows Animation Studio (studio/) and publishes it to GitHub Pages.
# Runs when the studio, a rig, a saved animation or the shared rig code changes
# on main (a Save in the studio commits animations/<asset>.json, which
# republishes the site with it), or by hand.
# One-time setup: Settings > Pages > Build and deployment > Source: GitHub Actions.
on:
  push:
    branches: [main]
    paths: ['studio/**', 'rigs/**', 'animations/**', 'src/anim/**', '.github/workflows/studio-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: studio-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx tsc --noEmit -p studio
      - run: npm run studio:build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: studio/dist }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
