<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Meadows Animation Studio</title>
</head>
<body>
  <header id="top">
    <div class="brand"><span class="logo">✦</span> Meadows <b>Animation Studio</b></div>
    <div class="group">
      <label class="field">Asset <select id="asset"></select></label>
      <label class="field">Clip <select id="clip"></select></label>
      <div class="menu">
        <button id="clip-menu" class="icon" title="Clip actions" aria-haspopup="true">⋯</button>
        <div id="clip-menu-list" class="menu-list" hidden>
          <button id="clip-new">＋ New clip</button>
          <button id="clip-dup">⧉ Copy this clip</button>
          <button id="clip-ren">✎ Rename</button>
          <button id="clip-del" class="danger">🗑 Delete</button>
        </div>
      </div>
    </div>
    <span class="spacer"></span>
    <div class="group">
      <button id="undo" class="icon" title="Undo (Ctrl+Z)">↶</button>
      <button id="redo" class="icon" title="Redo (Ctrl+Shift+Z)">↷</button>
    </div>
    <div class="group">
      <span id="dirty" class="dirty" hidden title="Unsaved changes (kept in this browser)">● Unsaved</span>
      <button id="save" class="primary" title="Commit animations/&lt;asset&gt;.json to GitHub (Ctrl+S)">⬆ Save to GitHub</button>
      <button id="download" title="Download the JSON file">⬇ Download</button>
      <button id="open" title="Open a JSON file">Open…</button>
      <input id="open-file" type="file" accept=".json,application/json" hidden />
      <button id="settings-btn" class="icon" title="GitHub token, repo and branch">⚙</button>
    </div>
  </header>
  <div id="banner" hidden></div>

  <main id="work">
    <div id="stage-wrap">
      <canvas id="stage"></canvas>
      <div class="stage-tools">
        <button id="v-zoom-out" class="icon" title="Zoom out">−</button>
        <button id="v-fit" class="icon" title="Fit the view (F)">⤢</button>
        <button id="v-zoom-in" class="icon" title="Zoom in">＋</button>
        <span class="sep"></span>
        <button id="t-ik" class="toggle" title="IK: dragging a hand or foot moves the whole limb">IK</button>
        <button id="t-pin" class="toggle" title="Pin feet: moving the hips keeps the feet planted">Pin feet</button>
        <button id="t-onion" class="toggle" title="Onion skin: show the previous and next key faintly">Onion</button>
        <button id="t-handles" class="toggle" title="Show the drag handles (H)">Handles</button>
        <button id="t-springs" class="toggle" title="Follow-through on playback (scarf, tails)">Follow-through</button>
      </div>
      <div class="stage-hint" id="stage-hint"></div>
      <div id="toast" role="status"></div>
    </div>
    <aside id="side"></aside>
  </main>

  <footer id="timeline"></footer>

  <aside id="help" hidden aria-label="Help">
    <div class="help-head">
      <h2>How to use the studio</h2>
      <button id="help-close" class="icon" title="Close (Esc)">✕</button>
    </div>
    <div id="help-body" class="help-body"></div>
  </aside>

  <dialog id="settings">
    <form method="dialog">
      <h2>Save to GitHub</h2>
      <p class="hint">Clips are saved by committing <code>animations/&lt;asset&gt;.json</code> to the repo. Use a
        <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">fine-grained token</a>
        for this repository only, with <b>Contents: Read and write</b>. It is kept in this browser and only sent to api.github.com.</p>
      <p id="s-note" class="note"></p>
      <label>Token <input id="s-token" type="password" autocomplete="off" placeholder="github_pat_…" /></label>
      <label>Repository <input id="s-repo" type="text" /></label>
      <label>Branch <input id="s-branch" type="text" /></label>
      <div class="btns">
        <button type="button" id="s-forget">Clear token</button>
        <span class="spacer"></span>
        <button type="button" id="s-cancel">Cancel</button>
        <button type="button" id="s-ok" class="primary">Save settings</button>
      </div>
    </form>
  </dialog>
  <script type="module" src="./main.ts"></script>
</body>
</html>
